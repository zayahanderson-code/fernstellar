<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vollrath Law — AI Intake</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:#f5f0e8; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .container { width:100%; max-width:460px; }
  .header { background:#0d1b2a; padding:16px 20px; border-radius:16px 16px 0 0; display:flex; align-items:center; gap:12px; }
  .dot { width:8px; height:8px; background:#22c55e; border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px rgba(34,197,94,.25)} 50%{box-shadow:0 0 0 6px rgba(34,197,94,.1)} }
  .header-text { flex:1; }
  .header-title { color:#fff; font-size:14px; font-weight:500; }
  .header-sub { color:rgba(255,255,255,.5); font-size:11px; }
  .badge { font-size:10px; background:rgba(201,168,76,.15); color:#e8c96a; border:1px solid rgba(201,168,76,.3); border-radius:20px; padding:3px 10px; }
  .messages { background:#fff; padding:20px; min-height:340px; max-height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  .msg { display:flex; gap:8px; align-items:flex-end; animation:fadeIn .3s ease; }
  .msg.user { flex-direction:row-reverse; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex-shrink:0; }
  .avatar.bot { background:#0d1b2a; color:#c9a84c; font-family:'Playfair Display',serif; }
  .avatar.user { background:#c9a84c; color:#0d1b2a; }
  .bubble { max-width:78%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.55; }
  .bot .bubble { background:#f8f7f5; border:1px solid rgba(0,0,0,.06); border-bottom-left-radius:4px; white-space:pre-line; }
  .user .bubble { background:#0d1b2a; color:#fff; border-bottom-right-radius:4px; }
  .typing-dots { display:flex; gap:4px; padding:12px 14px; background:#f8f7f5; border-radius:14px; border-bottom-left-radius:4px; }
  .typing-dots span { width:6px; height:6px; background:#6b7280; border-radius:50%; animation:bounce 1.2s infinite; }
  .typing-dots span:nth-child(2){animation-delay:.2s}
  .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-5px);opacity:1} }
  .quick-replies { padding:12px 20px; background:#fff; display:flex; flex-wrap:wrap; gap:8px; border-top:1px solid rgba(0,0,0,.05); }
  .qr-btn { padding:7px 14px; border-radius:999px; border:1px solid rgba(201,168,76,.3); background:#fff; color:#0d1b2a; font-family:'DM Sans',sans-serif; font-size:12.5px; cursor:pointer; transition:all .2s; }
  .qr-btn:hover { background:#0d1b2a; color:#fff; border-color:#0d1b2a; }
  .input-area { padding:12px 16px; background:#fafaf9; border-top:1px solid rgba(0,0,0,.06); border-radius:0 0 16px 16px; display:flex; gap:10px; align-items:center; }
  .chat-input { flex:1; border:1px solid rgba(0,0,0,.1); border-radius:999px; padding:9px 16px; font-family:'DM Sans',sans-serif; font-size:13px; outline:none; transition:border-color .2s; }
  .chat-input:focus { border-color:#c9a84c; box-shadow:0 0 0 3px rgba(201,168,76,.1); }
  .chat-input:disabled { opacity:.5; }
  .send-btn { width:36px; height:36px; border-radius:50%; background:#0d1b2a; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; flex-shrink:0; }
  .send-btn:hover:not(:disabled) { background:#c9a84c; }
  .send-btn:disabled { opacity:.4; cursor:not-allowed; }
  .send-btn svg { width:15px; height:15px; fill:none; stroke:#fff; stroke-width:2; }
  .footer { text-align:center; margin-top:10px; font-size:10.5px; color:#9ca3af; }
  .footer span { color:#0d1b2a; font-weight:500; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="dot"></div>
    <div class="header-text">
      <div class="header-title">Vollrath Law — Case Assistant</div>
      <div class="header-sub">Available 24/7 · Confidential</div>
    </div>
    <div class="badge">FL Bar Compliant</div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="quick-replies" id="quickReplies"></div>
  <div class="input-area">
    <input class="chat-input" id="chatInput" placeholder="Type your answer…" autocomplete="off"/>
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="footer">Powered by <span>Fern Stellar</span> AI</div>
</div>
<script>
  let currentStep = 0;
  let state = {};
  let history = [];
  let isTyping = false;

  const messagesEl = document.getElementById('messages');
  const quickRepliesEl = document.getElementById('quickReplies');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addMessage(text, role) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? 'F' : 'ME';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing';
    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'F';
    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    msg.appendChild(avatar);
    msg.appendChild(dots);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function removeTyping() { const t = document.getElementById('typing'); if(t) t.remove(); }

  function showQuickReplies(options) {
    quickRepliesEl.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = opt;
      btn.onclick = () => handleInput(opt);
      quickRepliesEl.appendChild(btn);
    });
    chatInput.disabled = true;
    sendBtn.disabled = true;
  }

  function clearQuickReplies() {
    quickRepliesEl.innerHTML = '';
    chatInput.disabled = false;
    sendBtn.disabled = false;
  }

  async function sendMessage(userMessage) {
    if (isTyping) return;
    isTyping = true;
    clearQuickReplies();
    addMessage(userMessage, 'user');
    chatInput.value = '';
    showTyping();

    try {
      const res = await fetch('/api/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ step: currentStep, state, userMessage, history })
      });
      const data = await res.json();

      await new Promise(r => setTimeout(r, data.delay || 900));
      removeTyping();

      if (data.done) {
        state = data.state;
        if (data.history) history = data.history;
        addMessage(data.message, 'bot');
        chatInput.disabled = true;
        sendBtn.disabled = true;
      } else {
        currentStep = data.step;
        state = data.state;
        if (data.history) history = data.history;
        addMessage(data.message, 'bot');
        if (data.type === 'quick' && data.options && data.options.length) showQuickReplies(data.options);
      }
    } catch(e) {
      removeTyping();
      addMessage('Something went wrong — give it another try!', 'bot');
    }
    isTyping = false;
  }

  function handleInput(text) {
    const val = text || chatInput.value.trim();
    if (!val) return;
    sendMessage(val);
  }

  chatInput.addEventListener('keydown', e => { if(e.key === 'Enter') handleInput(); });
  sendBtn.addEventListener('click', () => handleInput());

  async function init() {
    showTyping();
    await new Promise(r => setTimeout(r, 800));
    const res = await fetch('/api/start');
    const data = await res.json();
    removeTyping();
    currentStep = data.step;
    addMessage(data.message, 'bot');
  }

  init();
</script>
</body>
</html>
