<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ander - The Henry Law Firm AI Intake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0d1b2a 0%, #1a2a40 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 700px;
    }

    .header {
      background: linear-gradient(135deg, #0d1b2a 0%, #1a2a40 100%);
      color: white;
      padding: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header h1 { font-size: 20px; margin-bottom: 4px; font-weight: 600; }
    .header p  { font-size: 13px; opacity: 0.8; margin: 0; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { justify-content: flex-end; }

    .message-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.assistant .message-bubble { background: #f0f0f0; color: #0d1b2a; }
    .message.user      .message-bubble { background: #0d1b2a; color: white; }

    .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }

    .typing-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #999;
      animation: typing 1.4s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.5; transform: translateY(0); }
      30%            { opacity: 1;   transform: translateY(-10px); }
    }

    .input-area {
      border-top: 1px solid #eee;
      padding: 16px;
      display: flex;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-area input:focus { outline: none; border-color: #0d1b2a; }

    .send-btn {
      background: #0d1b2a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .send-btn:hover:not(:disabled) { background: #1a2a40; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Progress bar now has 4 steps to match actual collection flow ── */
    .progress {
      padding: 12px 20px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .progress-item { display: flex; align-items: center; gap: 6px; }
    .progress-dot  { width: 8px; height: 8px; border-radius: 50%; }
    .progress-dot.done    { background: #22c55e; }
    .progress-dot.pending { background: #ddd; }

    .calendly-link {
      padding: 16px 20px;
      border-top: 1px solid #eee;
      text-align: center;
    }
    .calendly-link a {
      background: #0d1b2a;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
      transition: background 0.2s;
    }
    .calendly-link a:hover { background: #1a2a40; }
  </style>
</head>
<body>
  <div class="container" role="main">
    <div class="header">
      <h1>Ander</h1>
      <p>The Henry Law Firm • AI Intake Assistant</p>
    </div>

    <div
      class="messages"
      id="messages"
      role="log"
      aria-live="polite"
      aria-label="Chat conversation"
    ></div>

    <!-- FIX: Progress bar now reflects actual 4-step collection flow -->
    <div class="progress" id="progress" style="display: none;" aria-label="Intake progress">
      <div class="progress-item">
        <div class="progress-dot pending" id="dot-name"></div>
        <span>Name</span>
      </div>
      <div class="progress-item">
        <div class="progress-dot pending" id="dot-story"></div>
        <span>Story</span>
      </div>
      <div class="progress-item">
        <div class="progress-dot pending" id="dot-case"></div>
        <span>Case Info</span>
      </div>
      <div class="progress-item">
        <div class="progress-dot pending" id="dot-contact"></div>
        <span>Contact</span>
      </div>
    </div>

    <div class="calendly-link" id="calendly" style="display: none;">
      <a href="https://calendly.com/lhenry-lawfirm" target="_blank" rel="noopener noreferrer">
        📅 Schedule a Free Consultation
      </a>
    </div>

    <div class="input-area" id="inputArea">
      <label for="userInput" class="sr-only">Your message</label>
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
        autofocus
        aria-label="Type your message"
        maxlength="2000"
      >
      <button class="send-btn" id="sendBtn" aria-label="Send message">Send</button>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const userInput   = document.getElementById('userInput');
    const sendBtn     = document.getElementById('sendBtn');
    const progressDiv = document.getElementById('progress');
    const calendlyDiv = document.getElementById('calendly');
    const inputArea   = document.getElementById('inputArea');

    let sessionId = null;
    let language  = 'en';
    let step      = 0;
    let pendingMessages = 0; // FIX: track pending delayed messages instead of a boolean

    // ── Disable/enable input while waiting ───────────────────────────────
    function setInputDisabled(disabled) {
      userInput.disabled = disabled;
      sendBtn.disabled   = disabled;
    }

    async function initSession() {
      setInputDisabled(true);
      try {
        const response = await fetch('/api/start?lang=' + language);
        if (!response.ok) throw new Error('Server error ' + response.status);
        const data = await response.json();
        sessionId = data.sessionId;
        step      = data.step;
        displayMessage(data.message, 'assistant', data.delay);
      } catch (err) {
        console.error('Init failed:', err);
        displayMessage('Connection error. Please refresh the page.', 'assistant');
        setInputDisabled(false);
      }
    }

    // FIX: track pending messages so input stays locked until the last
    // delayed message has rendered
    function displayMessage(content, role, delay = 0) {
      pendingMessages++;
      setInputDisabled(true);
      setTimeout(() => {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + role;
        messageDiv.setAttribute('role', role === 'assistant' ? 'status' : 'none');

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = content; // textContent is XSS-safe — do NOT change to innerHTML
        messageDiv.appendChild(bubble);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        pendingMessages--;
        if (pendingMessages === 0) setInputDisabled(false);
      }, delay);
    }

    function showTyping() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';
      messageDiv.id = 'typing-indicator';
      const typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.setAttribute('aria-label', 'Ander is typing');
      typing.innerHTML =
        '<div class="typing-dot"></div>' +
        '<div class="typing-dot"></div>' +
        '<div class="typing-dot"></div>';
      messageDiv.appendChild(typing);
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const content = userInput.value.trim();
      // FIX: check pendingMessages instead of isWaiting boolean
      if (!content || pendingMessages > 0) return;

      userInput.value = '';
      setInputDisabled(true);

      displayMessage(content, 'user');
      showTyping();

      try {
        const response = await fetch('/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ step, userMessage: content, sessionId, language })
        });

        if (!response.ok) throw new Error('Server error ' + response.status);
        const data = await response.json();

        hideTyping();
        step = data.step;

        if (data.message) {
          displayMessage(data.message, 'assistant', data.delay || 800);
        }

        if (data.progress) {
          updateProgress(data.progress);
          progressDiv.style.display = 'flex';
        }

        if (data.done) {
          inputArea.style.display = 'none';
          if (data.calendlyLink) calendlyDiv.style.display = 'block';
        }
      } catch (err) {
        console.error('Send failed:', err);
        hideTyping();
        displayMessage('Something went wrong. Please try again.', 'assistant');
        setInputDisabled(false);
      }
    }

    // FIX: use individual dot IDs instead of querySelectorAll index (fragile)
    function updateProgress(progress) {
      if (progress.name)    document.getElementById('dot-name').className    = 'progress-dot done';
      if (progress.story)   document.getElementById('dot-story').className   = 'progress-dot done';
      if (progress.caseInfo)document.getElementById('dot-case').className    = 'progress-dot done';
      if (progress.phone || progress.email)
                            document.getElementById('dot-contact').className = 'progress-dot done';
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    initSession();
  </script>
</body>
</html>
